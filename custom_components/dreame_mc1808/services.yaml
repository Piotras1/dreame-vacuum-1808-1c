vacuum_clean_zone:
  name: Clean zone
  description: Clean a specific rectangular zone on the Dreame MC1808.
  target:
    entity:
      domain: vacuum
  fields:
    zone:
      name: Zone coordinates
      description: "Coordinates in the format: x1,y1,x2,y2"
      required: true
      example: "-4100,-4700,700,-800"
      selector:
        text:
    repeats:
      name: Repeats
      description: "Number of cleaning passes. Currently not supported by the device firmware; accepted for compatibility only."
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 3

vacuum_clean_segment:
  name: Clean room/segment (EXPERIMENTAL)
  description: >
    Clean specific room/segment IDs (e.g. from Xiaomi Cloud Map Extractor).
    EXPERIMENTAL: sourced from a community-documented config for this exact
    model, not verified by this project against real hardware. At least one
    reported case got a "success" response with no physical movement. Test
    with a single room first and watch the vacuum.
  target:
    entity:
      domain: vacuum
  fields:
    room_ids:
      name: Room IDs
      description: One or more room/segment IDs to clean.
      required: true
      example: "[3, 5]"
      selector:
        object:
    repeats:
      name: Repeats
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 3
    fan_speed:
      name: Fan speed
      description: "0=Silent, 1=Standard, 2=Medium, 3=Turbo"
      required: false
      default: 1
      selector:
        number:
          min: 0
          max: 3

